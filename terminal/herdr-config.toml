onboarding = false

[keys]
prefix = "alt+tab"

# --- pane ---
split_vertical = "prefix+v"
split_horizontal = "prefix+h"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
cycle_pane_previous = "prefix+;"
cycle_pane_next = "prefix+'"
last_pane = "prefix+backtick"

# --- tab ---
new_tab = "prefix+t"
rename_tab = "prefix+g"
previous_tab = "prefix+["
next_tab = "prefix+]"

# --- workspace ---
new_workspace = "prefix+n"
new_worktree = "prefix+shift+n"
rename_workspace = "prefix+shift+g"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
switch_workspace = "prefix+shift+1..9"
goto = "prefix+f"

# --- agent ---
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"

# --- close ---
close_pane = "prefix+x"
close_tab = "prefix+shift+x"
close_workspace = "prefix+shift+d"
remove_worktree = "prefix+shift+w"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

# --- custom commands ---
# Stop the herdr server (kills all panes and agents). No confirmation prompt.
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "herdr server stop"
